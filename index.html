<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 입을 옷 추천</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --sub-text: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2C3E50;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--sub-text);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .display-area {
            background-color: #FAFBFD;
            border: 2px dashed #E1E8ED;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .emoji-display {
            font-size: 80px;
            margin-bottom: 15px;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .outfit-name {
            font-size: 20px;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 8px;
        }

        .outfit-desc {
            font-size: 14px;
            color: var(--sub-text);
            word-break: keep-all;
        }

        .recommend-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        .recommend-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        .recommend-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(74, 144, 226, 0.3);
        }

        /* 통통 튀는 애니메이션 */
        .bounce {
            animation: bounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ 오늘 뭐 입지?</h1>
        <p class="subtitle">결정이 어려울 땐 버튼을 눌러보세요!<br>오늘의 추천 코디를 이모지로 보여드립니다.</p>
        
        <div class="display-area" id="displayArea">
            <div class="emoji-display" id="emoji">👔</div>
            <div class="outfit-name" id="outfitName">버튼을 눌러주세요!</div>
            <div class="outfit-desc" id="outfitDesc">오늘 날씨와 기분에 딱 맞는 옷을 추천해 드려요.</div>
        </div>

        <button class="recommend-btn" id="recommendBtn" onclick="recommendOutfit()">오늘 입을 옷 추천</button>
    </div>

    <script>
        const outfits = [
            {
                emoji: "👕 👖 👟",
                name: "캐주얼 데일리룩",
                desc: "편안함과 스타일을 모두 잡은 티셔츠와 청바지 조합!"
            },
            {
                emoji: "👔 👖 👞",
                name: "깔끔한 셔츠룩",
                desc: "단정하고 지적인 느낌을 주는 셔츠와 슬랙스 스타일."
            },
            {
                emoji: "🧥 🐢 👞",
                name: "덴디한 자켓룩",
                desc: "쌀쌀한 날씨에 딱! 겉옷 하나로 완성하는 세련된 코디."
            },
            {
                emoji: "👗 👠 👜",
                name: "우아한 원피스룩",
                desc: "화사하고 기분 좋은 날을 만들어주는 예쁜 원피스."
            },
            {
                emoji: "🏃‍♂️ 🎽 👟",
                name: "편안한 스포티룩",
                desc: "활동성 최강! 트레이닝 복과 편한 운동화 조합."
            },
            {
                emoji: "🧥 👖 🥾",
                name: "따뜻한 숏패딩 코디",
                desc: "추운 날 바람을 막아주는 포근하고 가벼운 패딩 스타일."
            },
            {
                emoji: "🧥 🧣 👢",
                name: "클래식 코트룩",
                desc: "분위기 있는 날, 목도리와 함께 연출하는 클래식한 코트."
            },
            {
                emoji: "🎽 🩳 🩴",
                name: "시원한 리조트룩",
                desc: "더운 날씨에 최고! 린넨 반바지와 시원한 슬리퍼."
            }
        ];

        function recommendOutfit() {
            const emojiEl = document.getElementById("emoji");
            const nameEl = document.getElementById("outfitName");
            const descEl = document.getElementById("outfitDesc");
            
            // 랜덤 코디 선택
            const randomIndex = Math.floor(Math.random() * outfits.length);
            const selected = outfits[randomIndex];

            // 애니메이션 재실행 리셋
            emojiEl.classList.remove("bounce");
            void emojiEl.offsetWidth; // Reflow 트리거

            // 내용 업데이트 및 애니메이션 적용
            emojiEl.innerText = selected.emoji;
            nameEl.innerText = selected.name;
            descEl.innerText = selected.desc;
            
            emojiEl.classList.add("bounce");
        }
    </script>

</body>
</html>
